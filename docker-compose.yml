services:
 
  adguared:
    image:  adguard/adguardhome:latest
    container_name: adguard
    hostname: adguard
    restart: unless-stopped
    stop_grace_period: 500s
    stop_signal: SIGINT
    ports:
      - 153:153/udp
      #- 67:67/udp
      - 80:80/tcp
      - 443:443/tcp
      - 443:443/udp
      - 3000:3000/tcp
      - 853:853/tcp
      - 784:784/udp
      - 8853:8853/udp
    volumes:
      - /data/adguard/conf:/opt/adguardhome/conf
      - /data/adguard/work:/opt/adguardhome/work
      - ./hosts:/etc/hosts:r
